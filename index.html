<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SVT CARAT 2026 BINGO</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --rose: #F7CAC9;
            --serenity: #92A8D1;
            --bg-pure-white: #FFFFFF; /* 純白背景 */
            --dark: #2D2D2D;
            --dark-gray: #555555; /* 白底上的深灰色字 */
            --card-bg: #FFFFFF;
            --glass: rgba(255, 255, 255, 0.3);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            margin: 0; padding: 0; 
            background-color: var(--bg-pure-white); /* 1. 背景變純白 */
            font-family: 'Noto Sans TC', sans-serif; color: var(--dark);
            display: flex; flex-direction: column; align-items: center;
        }

        /* --- 頁面切換 --- */
        .page { display: none; width: 100%; max-width: 1000px; animation: fadeIn 0.3s ease-in-out; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .container { width: 92%; margin: 15px auto; display: flex; flex-direction: column; gap: 15px; }
        
        /* ==========================================
           首頁: 排版優化 (Anton 字體與深灰文字)
           ========================================== */
        .hero-section {
            display: grid; grid-template-columns: 1fr 1.2fr;
            background: white; border-radius: 30px; overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.03); border: 1px solid #eee;
        }
        .hero-left { 
            background: linear-gradient(135deg, var(--rose), var(--serenity)); 
            display: flex; align-items: center; justify-content: center; padding: 30px;
        }
        
        .avatar-group { display: flex; align-items: center; justify-content: center; position: relative; }
        .avatar-on-hero { width: 75px; height: 75px; background: white; border-radius: 50%; overflow: hidden; position: relative; border: 4px solid white; box-shadow: 0 4px 10px rgba(0,0,0,0.08); display: flex; align-items: center; justify-content: center; font-size: 2rem; color: #ccc; }
        .avatar-on-hero img { width: 100%; height: 100%; object-fit: cover; }
        .avatar-on-hero img[src=""] { display: none; }

        .hero-right { padding: 30px; display: flex; flex-direction: column; justify-content: center; }
        .tag { background: var(--rose); color: white; padding: 4px 15px; border-radius: 20px; font-weight: 900; width: fit-content; margin-bottom: 10px; font-size: 0.8rem; }
        
        /* 標題與其他白底文字改為深灰色 */
        .hero-right h1 { font-family: 'Anton', sans-serif; font-size: 2.2rem; margin: 0; line-height: 1.1; color: var(--dark-gray); text-transform: uppercase; letter-spacing: -1px; }
        .hero-right h1 span { color: var(--serenity); }
        .deadline-card span { font-size: 0.6rem; color: #bbb; font-weight: 700; letter-spacing: 1px; }
        .deadline-date { font-size: 1.2rem; font-weight: 900; color: var(--dark-gray); } /* 深灰 */

        .countdown-section { display: grid; grid-template-columns: 1fr; gap: 10px; }
        .deadline-card { background: white; border-radius: 20px; padding: 15px; border-left: 8px solid var(--rose); text-align: center; border: 1px solid #eee; }
        .timer-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .timer-box { background: white; border-radius: 15px; padding: 10px; text-align: center; border: 2.5px solid var(--serenity); }
        .timer-num { font-size: 1.2rem; font-weight: 900; display: block; color: var(--serenity); }
        .timer-label { font-size: 0.6rem; color: #bbb; font-weight: 700; }

        /* 玩家列表 (深灰文字) */
        .player-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 10px 0; }
        .player-card { background: white; border-radius: 20px; padding: 15px 10px; text-align: center; cursor: pointer; transition: 0.3s; border: 1.5px solid #eee; }
        .player-card:hover { border-color: var(--rose); transform: translateY(-3px); }
        .avatar-box { width: 60px; height: 60px; background: #eee; border-radius: 50%; margin: 0 auto 10px; overflow: hidden; position: relative; border: 2px solid white; box-shadow: 0 4px 10px rgba(0,0,0,0.05); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; color: #aaa; }
        .avatar-box img { width: 100%; height: 100%; object-fit: cover; }
        .avatar-box img[src=""] { display: none; }
        .player-name { font-weight: 900; font-size: 0.9rem; color: var(--dark-gray); } /* 深灰 */

        /* 遊戲規則 (深灰文字) */
        .rules-card { background: white; border-radius: 25px; padding: 25px; border: 1px solid #eee; }
        .rules-card h2 { margin: 0 0 15px; font-size: 1.2rem; font-weight: 900; color: var(--dark-gray); } /* 深灰 */
        .rules-card ol { padding-left: 18px; font-size: 0.85rem; line-height: 1.8; color: var(--dark-gray); font-weight: 500; } /* 深灰 */

        /* ==========================================
           賓果盤頁面: 應援色交錯與手繪星星
           ========================================== */
        #bingo-capture-zone { 
            background: var(--bg-pure-white); /* 1. 背景變純白 */
            border-radius: 30px; padding: 40px 20px; text-align: center; color: var(--dark);
            border: 1px solid #eee;
        }
        
        /* 純白背景上的深灰字 */
        #bingo-capture-zone h2 { font-weight: 900; font-size: 1.6rem; color: var(--dark-gray); }
        #bingo-capture-zone div[style*="font-weight:700"] { color: #888; }

        .avatar-box-lg { 
            width: 90px; height: 90px; background: white; border-radius: 50%; margin: 0 auto 10px; 
            overflow: hidden; border: 5px solid white; box-shadow: 0 8px 20px rgba(0,0,0,0.1); 
            display: flex; align-items: center; justify-content: center; font-size: 2.5rem; color: #ccc; cursor: pointer;
        }
        .avatar-box-lg img { width: 100%; height: 100%; object-fit: cover; }
        .avatar-box-lg img[src=""] { display: none; }

        /* 應援色實心底與白字排列 */
        .bingo-board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; aspect-ratio: 1/1; margin-top: 25px; }
        .cell {
            background: var(--glass); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border-radius: 15px; border: 1px solid rgba(255,255,255,0.4);
            display: flex; align-items: center; justify-content: center; padding: 8px;
            position: relative; overflow: hidden;
            border-radius: 20px; /* 統一格子圓潤感 */
        }
        
        /* 3. 配色排列但保持交錯 */
        /* 奇數格: Rose Quartz (實心粉底) */
        .cell:nth-child(odd) { background-color: var(--rose); color: white; }
        /* 偶數格: Serenity (實心藍底) */
        .cell:nth-child(even) { background-color: var(--serenity); color: white; }

        /* 輸入白字 */
        .cell textarea, .cell-text { color: white !important; font-weight: 700; text-align: center; }

        /* 被標記時的底色 */
        .cell.marked { filter: brightness(0.95); border: 2.5px solid white; }
        .cell.marked:nth-child(odd) { background-color: #f2b1af; } /* 標記後的實心粉 */
        .cell.marked:nth-child(even) { background-color: #7b94c4; } /* 標記後的實心藍 */

        /* 2. 中央格：手繪感星星 (仿圖1、圖2) */
        .cell:nth-child(5) {
            background-color: transparent; border: none;
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            -webkit-clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            /* 手繪星星感：用應援漸層填充 */
            background: linear-gradient(135deg, var(--rose), var(--serenity)) !important;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        /* 中央格文字處理：純白大字 */
        .cell:nth-child(5) textarea, .cell:nth-child(5) .cell-text { font-family: 'Anton', sans-serif; font-size: 1.2rem; text-transform: uppercase; letter-spacing: 0.5px; }

        .cell textarea {
            width: 100%; height: 100%; background: transparent; border: none;
            resize: none; outline: none; font-family: inherit; font-size: 1rem;
            display: flex; align-items: center; justify-content: center;
            padding: 0; line-height: 1.2;
            padding-top: calc(50% - 0.6em); /* 文字垂直置中 */
        }
        .cell textarea::placeholder { color: rgba(255,255,255,0.7); }
        
        .cell-text { font-weight: 900; font-size: 1rem; line-height: 1.3; word-break: break-all; }
        .stamp { position: absolute; font-size: 3rem; opacity: 0.8; pointer-events: none; }

        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 20px 0; }
        .btn { padding: 12px; border-radius: 50px; border: none; font-weight: 900; cursor: pointer; font-size: 0.85rem; font-family: inherit; transition: 0.3s; }
        .btn:hover { opacity: 0.8; }
        .btn-full { grid-column: span 2; }
        .btn-rose { background: var(--rose); color: white; border: 2px solid white; box-shadow: 4px 4px 0 rgba(0,0,0,0.1); }
        .btn-serenity { background: var(--serenity); color: white; border: 2px solid white; box-shadow: 4px 4px 0 rgba(0,0,0,0.1); }
        .btn-white { background: white; color: var(--dark); border: 2px solid #ddd; }

        .upload-hint { font-size: 0.6rem; color: #999; margin-top: 5px; cursor: pointer; text-decoration: underline; }

        @media (max-width: 600px) {
            #bingo-capture-zone { border-radius: 0; }
        }
    </style>
</head>
<body>

    <div id="page-home" class="page active">
        <div class="container">
            <div class="hero-section">
                <div class="hero-left">
                    <div class="avatar-group">
                        <div class="avatar-on-hero" style="z-index:3;">💎<img id="h-img-0" src="" alt=""></div>
                        <div class="avatar-on-hero" style="margin-left:-30px; z-index:2; transform:scale(0.9);">💎<img id="h-img-1" src="" alt=""></div>
                        <div class="avatar-on-hero" style="margin-left:-30px; z-index:1; transform:scale(0.8);">💎<img id="h-img-2" src="" alt=""></div>
                    </div>
                </div>
                <div class="hero-right">
                    <div class="tag">2026 CARAT 目標</div>
                    <h1>9 宮格<span>賓果</span> CHALLENGE</h1>
                </div>
            </div>

            <div class="countdown-section">
                <div class="deadline-card">
                    <span>📅 DEADLINE</span>
                    <div class="deadline-date">2026 / 07 / 31</div>
                </div>
                <div class="timer-grid">
                    <div class="timer-box"><span class="timer-num" id="d">--</span><span class="timer-label">DAYS</span></div>
                    <div class="timer-box"><span class="timer-num" id="h">--</span><span class="timer-label">HOURS</span></div>
                    <div class="timer-box"><span class="timer-num" id="m">--</span><span class="timer-label">MINS</span></div>
                    <div class="timer-box"><span class="timer-num" id="s">--</span><span class="timer-label">SECS</span></div>
                </div>
            </div>

            <div class="player-grid" id="player-list"></div>

            <div class="rules-card">
                <h2>📜 CARAT 遊戲規則 (深灰文字)</h2>
                <ol>
                    <li>選取一玩家進入專屬賓果盤</li>
                    <li>石英粉與寧靜藍實心格交錯排列，輸入白字挑戰項目</li>
                    <li>中央格為「手繪漸層星星」自由格，點擊編輯內容</li>
                    <li>按「鎖定」內容開始遊戲，雙擊格子蓋章連線挑戰</li>
                </ol>
            </div>
        </div>
    </div>

    <div id="page-bingo" class="page">
        <div class="container">
            <button class="btn btn-white" onclick="showHome()">← 返回列表</button>
            
            <div id="bingo-capture-zone">
                <div class="avatar-box-lg" onclick="triggerUpload()">
                    💎<img id="current-avatar-img" src="" alt="" style="display:none;">
                </div>
                <div class="upload-hint" onclick="triggerUpload()">點擊更換頭像貼紙</div>
                <h2 id="current-player-name" style="margin:5px 0;">PLAYER (深灰)</h2>
                <div style="font-weight:700; opacity:0.8; font-size:0.8rem; letter-spacing:2px; margin-bottom:20px;">SVT BINGO CHALLENGE</div>

                <div class="bingo-board" id="bingo-grid"></div>
            </div>

            <input type="file" id="avatar-input" hidden accept="image/*" onchange="handleAvatarUpload(event)">

            <div class="controls">
                <select id="bias-select" class="btn btn-white btn-full" onchange="updateBias()">
                    <option value="🍊">蓋章：勝寛 🍊</option>
                    <option value="🐯">蓋章：Hoshi 🐯</option>
                    <option value="🍚">蓋章：Woozi Rice🍚</option>
                    <option value="👼">蓋章：淨漢 Angel👼</option>
                </select>
                <button id="lock-btn" class="btn btn-rose" onclick="toggleLock()">🔒 鎖定賓果盤</button>
                <button id="shuffle-btn" class="btn btn-serenity" onclick="shuffleGrid()">🎲 隨機排亂</button>
                <button class="btn btn-serenity btn-full" onclick="downloadWallpaper()">📸 下載應援桌布 (9:16)</button>
            </div>
        </div>
    </div>

    <script>
        const players = ["金妮", "然然", "雅雯"];
        let gameData = JSON.parse(localStorage.getItem('svt_v4_data')) || {};
        let currentPlayer = "";
        const targetDate = new Date("2026-07-31T23:59:59").getTime();

        function init() {
            renderPlayers();
            updateTimer();
            setInterval(updateTimer, 1000);
            
            players.forEach((name, i) => {
                if(gameData[name] && gameData[name].avatar) {
                    const img = document.getElementById(`h-img-${i}`);
                    if(img) img.src = gameData[name].avatar;
                }
            });
        }

        function renderPlayers() {
            const list = document.getElementById('player-list');
            list.innerHTML = "";
            players.forEach((name, i) => {
                const card = document.createElement('div');
                card.className = "player-card";
                const avatarSrc = (gameData[name] && gameData[name].avatar) ? gameData[name].avatar : "";
                card.innerHTML = `
                    <div class="avatar-box">
                        <span class="avatar-placeholder">💎</span>
                        <img src="${avatarSrc}" alt="" style="display:${avatarSrc?'block':'none'}">
                    </div>
                    <span class="player-name">${name}</span>
                `;
                card.onclick = () => openBingo(name);
                list.appendChild(card);
            });
        }

        function openBingo(name) {
            currentPlayer = name;
            if (!gameData[name]) {
                // 初始化中央格內容為 FREE-C (仿參考圖1)
                gameData[name] = { grid: Array(9).fill({text: "", marked: false}), bias: "🍊", locked: false, avatar: "" };
                gameData[name].grid[4] = {text: "CARAT DIAMOND", marked: true};
            }
            document.getElementById('page-home').classList.remove('active');
            document.getElementById('page-bingo').classList.add('active');
            document.getElementById('current-player-name').innerText = name;
            const img = document.getElementById('current-avatar-img');
            if(gameData[name].avatar) {
                img.src = gameData[name].avatar; img.style.display = 'block';
            } else { img.style.display = 'none'; }
            document.getElementById('bias-select').value = gameData[name].bias;
            renderGrid(); window.scrollTo(0,0);
        }

        function renderGrid() {
            const grid = document.getElementById('bingo-grid');
            grid.innerHTML = "";
            const data = gameData[currentPlayer];
            document.getElementById('lock-btn').innerText = data.locked ? "🔓 解鎖編輯" : "🔒 鎖定內容";
            document.getElementById('shuffle-btn').style.display = data.locked ? "none" : "block";

            data.grid.forEach((item, i) => {
                const cell = document.createElement('div');
                cell.className = `cell ${item.marked ? 'marked' : ''}`;
                
                if (!data.locked) {
                    const area = document.createElement('textarea');
                    area.value = item.text;
                    area.placeholder = i === 4 ? "自由格" : "挑戰項目";
                    area.oninput = (e) => { data.grid[i].text = e.target.value; save(); };
                    cell.appendChild(area);
                } else {
                    cell.innerHTML = `<div class="cell-text">${item.text}</div>`;
                    if (item.marked) {
                        const s = document.createElement('div');
                        s.className = "stamp"; s.innerText = data.bias; cell.appendChild(s);
                    }
                    cell.ondblclick = () => toggleMark(i);
                }
                grid.appendChild(cell);
            });
        }

        function triggerUpload() { document.getElementById('avatar-input').click(); }
        function handleAvatarUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const base64 = e.target.result;
                    gameData[currentPlayer].avatar = base64;
                    document.getElementById('current-avatar-img').src = base64;
                    save(); renderPlayers();
                }; reader.readAsDataURL(file);
            }
        }

        function showHome() { document.getElementById('page-bingo').classList.remove('active'); document.getElementById('page-home').classList.add('active'); location.reload(); }
        function toggleLock() { gameData[currentPlayer].locked = !gameData[currentPlayer].locked; save(); renderGrid(); }
        function toggleMark(i) {
            if (!gameData[currentPlayer].locked) return;
            gameData[currentPlayer].grid[i].marked = !gameData[currentPlayer].grid[i].marked;
            if (gameData[currentPlayer].grid[i].marked) {
                confetti({ particleCount: 80, spread: 50, colors: ['#F7CAC9', '#92A8D1'], origin: { y: 0.8 } });
            }
            save(); renderGrid();
        }

        function shuffleGrid() {
            let mid = gameData[currentPlayer].grid[4];
            let rest = gameData[currentPlayer].grid.filter((_, i) => i !== 4);
            rest.sort(() => Math.random() - 0.5);
            rest.splice(4, 0, mid); gameData[currentPlayer].grid = rest; save(); renderGrid();
        }

        function updateBias() { gameData[currentPlayer].bias = document.getElementById('bias-select').value; save(); renderGrid(); }
        function save() { localStorage.setItem('svt_v4_data', JSON.stringify(gameData)); }

        function updateTimer() {
            const now = new Date().getTime(); const diff = targetDate - now;
            if (diff < 0) return;
            document.getElementById('d').innerText = Math.floor(diff / 86400000).toString().padStart(2, '0');
            document.getElementById('h').innerText = Math.floor((diff % 86400000) / 3600000).toString().padStart(2, '0');
            document.getElementById('m').innerText = Math.floor((diff % 3600000) / 60000).toString().padStart(2, '0');
            document.getElementById('s').innerText = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');
        }

        async function downloadWallpaper() {
            const element = document.getElementById('bingo-capture-zone');
            const canvas = await html2canvas(element, { scale: 3, backgroundColor: '#FFFFFF' });
            const link = document.createElement('a');
            link.download = `SVT_BINGO_CHALLENGE_${currentPlayer}.png`; link.href = canvas.toDataURL(); link.click();
        }

        init();
    </script>
</body>
</html>
